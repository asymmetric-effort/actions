name: Poll Supply Chain Requests

on:
  schedule:
    - cron: "0 7 * * *" # Daily at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Poll org repos for supply chain requests
        env:
          GH_TOKEN: ${{ secrets.SUPPLY_CHAIN_TOKEN }}
        run: |
          set -euo pipefail

          ORG="asymmetric-effort"
          THIS_REPO="${ORG}/actions"
          LABEL="github-action-request"

          echo "Discovering repositories in ${ORG}..."

          # Dynamically discover all org repos.
          REPOS=$(gh repo list "$ORG" --no-archived --json nameWithOwner --jq '.[].nameWithOwner' 2>/dev/null || echo "")

          if [ -z "$REPOS" ]; then
            echo "No repositories found"
            exit 0
          fi

          REPO_COUNT=$(echo "$REPOS" | wc -l)
          echo "Found ${REPO_COUNT} repositories"

          # Ensure the label exists in this repo.
          if ! gh label list --repo "$THIS_REPO" --json name --jq '.[].name' 2>/dev/null | grep -qx "$LABEL"; then
            echo "Creating label '${LABEL}' in ${THIS_REPO}"
            gh label create "$LABEL" \
              --repo "$THIS_REPO" \
              --description "Request to replace a third-party GitHub Action with an internal action" \
              --color "d93f0b" 2>/dev/null || true
          fi

          CREATED=0

          # Scan each repo for issues with the github-action-request label.
          echo "$REPOS" | while IFS= read -r repo; do
            # Skip this repo.
            [ "$repo" = "$THIS_REPO" ] && continue

            echo "Scanning ${repo} for ${LABEL} issues..."

            ISSUES=$(gh issue list \
              --repo "$repo" \
              --state open \
              --label "$LABEL" \
              --json number,title,url,body \
              --jq '.[]' 2>/dev/null || echo "")

            [ -z "$ISSUES" ] && continue

            echo "$ISSUES" | jq -c '.' | while IFS= read -r issue; do
              ISSUE_NUMBER=$(echo "$issue" | jq -r '.number')
              ISSUE_TITLE=$(echo "$issue" | jq -r '.title')
              ISSUE_URL=$(echo "$issue" | jq -r '.url')
              ISSUE_BODY=$(echo "$issue" | jq -r '.body')

              # Extract the third-party action path from the issue body or title.
              # Try body first (more reliable), then title.
              ACTION_PATH=""
              ACTION_PATH=$(echo "$ISSUE_BODY" | grep -oP 'Third-party action:\*\* `\K[^`]+' 2>/dev/null || true)
              if [ -z "$ACTION_PATH" ]; then
                ACTION_PATH=$(echo "$ISSUE_TITLE" | grep -oP 'Replace `\K[^`]+' 2>/dev/null || true)
              fi

              if [ -z "$ACTION_PATH" ]; then
                echo "  Could not extract action path from ${repo}#${ISSUE_NUMBER}, skipping"
                continue
              fi

              # Extract upstream URL from body if available.
              UPSTREAM_URL=""
              UPSTREAM_URL=$(echo "$ISSUE_BODY" | grep -oP 'Upstream:\*\* \K\S+' 2>/dev/null || true)
              if [ -z "$UPSTREAM_URL" ]; then
                UPSTREAM_URL="https://github.com/${ACTION_PATH}"
              fi

              # Extract workflow URL from body if available.
              WORKFLOW_URL=""
              WORKFLOW_URL=$(echo "$ISSUE_BODY" | grep -oP 'Source workflow:\*\* \[\K[^\]]+' 2>/dev/null || true)

              # Build the tracking issue title.
              LOCAL_TITLE="Replace \`${ACTION_PATH}\` with internal action"

              # Check if a tracking issue already exists in this repo.
              EXISTING=$(gh issue list \
                --repo "$THIS_REPO" \
                --state open \
                --label "$LABEL" \
                --search "Replace \`${ACTION_PATH}\`" \
                --json number \
                --jq 'length' 2>/dev/null || echo "0")

              if [ "$EXISTING" -gt 0 ]; then
                echo "  Tracking issue already exists for ${ACTION_PATH}, skipping"
                continue
              fi

              # Build the issue body.
              BODY="## Internal Action Request

          A company repository has requested a replacement for a third-party GitHub Action.

          **Third-party action:** \`${ACTION_PATH}\`
          **Upstream:** ${UPSTREAM_URL}
          **Requested by:** [${repo}#${ISSUE_NUMBER}](${ISSUE_URL})"

              if [ -n "$WORKFLOW_URL" ]; then
                BODY="${BODY}
          **Source workflow:** ${WORKFLOW_URL}"
              fi

              BODY="${BODY}

          Create an internal composite action to replace this third-party dependency.
          Once implemented, update the requesting repository's workflows to use the new action."

              echo "  Creating tracking issue for ${ACTION_PATH}..."
              gh issue create \
                --repo "$THIS_REPO" \
                --title "$LOCAL_TITLE" \
                --body "$BODY" \
                --label "$LABEL" 2>/dev/null || echo "  Failed to create issue for ${ACTION_PATH}"

              CREATED=$((CREATED + 1))
            done
          done

          echo ""
          echo "Poll complete"
