name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-check:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/sync-versions.js --check

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        action: [setup-bun, gh-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: actions/${{ matrix.action }}
        run: npm ci
      - name: Lint
        working-directory: actions/${{ matrix.action }}
        run: npm run lint
      - name: Typecheck
        working-directory: actions/${{ matrix.action }}
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        action: [setup-bun, gh-release, fossa-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: actions/${{ matrix.action }}
        run: npm ci
      - name: Run tests
        working-directory: actions/${{ matrix.action }}
        run: npm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.action }}
          path: actions/${{ matrix.action }}/coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    strategy:
      matrix:
        action: [setup-bun, gh-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: actions/${{ matrix.action }}
        run: npm ci
      - name: Build
        working-directory: actions/${{ matrix.action }}
        run: npm run build
