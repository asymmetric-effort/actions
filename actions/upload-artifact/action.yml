name: "Upload Artifact"
description: "Upload build artifacts from a workflow run"
author: "Asymmetric Effort, LLC"

branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  name:
    description: "Name of the artifact"
    required: true
  path:
    description: "File, directory, or wildcard pattern for files to upload"
    required: true
  retention-days:
    description: "Number of days to retain the artifact (1-90, empty = repo default)"
    required: false
    default: ""
  if-no-files-found:
    description: "Behavior when no files are found (warn, error, ignore)"
    required: false
    default: "warn"
  compression-level:
    description: "zlib compression level (0-9)"
    required: false
    default: "6"
  overwrite:
    description: "Whether to overwrite an existing artifact with the same name"
    required: false
    default: "false"

outputs:
  artifact-id:
    description: "The ID of the uploaded artifact"
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: "URL to download the artifact"
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_RETENTION_DAYS: ${{ inputs.retention-days }}
        INPUT_IF_NO_FILES_FOUND: ${{ inputs.if-no-files-found }}
        INPUT_COMPRESSION_LEVEL: ${{ inputs.compression-level }}
        INPUT_OVERWRITE: ${{ inputs.overwrite }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/validate.sh"
        validate_upload_inputs

    - name: Upload artifact
      id: upload
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_RETENTION_DAYS: ${{ inputs.retention-days }}
        INPUT_IF_NO_FILES_FOUND: ${{ inputs.if-no-files-found }}
        INPUT_COMPRESSION_LEVEL: ${{ inputs.compression-level }}
        INPUT_OVERWRITE: ${{ inputs.overwrite }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/upload.sh"
        upload_artifact
