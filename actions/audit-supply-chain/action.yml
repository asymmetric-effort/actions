name: "Audit Supply Chain"
description: "Scan workflows for third-party GitHub Actions and create issues requesting replacements"
author: "Asymmetric Effort, LLC"

branding:
  icon: "shield"
  color: "red"

inputs:
  token:
    description: "GitHub token with issues:write permission for this repo"
    required: true
  allowed-orgs:
    description: "Comma-separated list of allowed action orgs (will not be flagged)"
    required: false
    default: "actions,github,asymmetric-effort"

outputs:
  findings-count:
    description: "Number of third-party action findings"
    value: ${{ steps.audit.outputs.findings_count }}

runs:
  using: "composite"
  steps:
    - name: Audit supply chain
      id: audit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_ALLOWED_ORGS: ${{ inputs.allowed-orgs }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/scan.sh"
        source "${GITHUB_ACTION_PATH}/scripts/issues.sh"
        audit_supply_chain
